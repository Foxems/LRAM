name: Build

# Builds Lantern and runs the self-tests on every push and pull request. Pushing a tag like v1.0.1 also publishes the zip as a
# GitHub release. The same build.ps1 you run locally does all the work.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # -Offline skips the few self-tests that talk to Roblox, so a Roblox outage can't fail a build.
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Zip -Test -Offline

      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-win-x64
          path: dist/Lantern-*-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lantern-win-x64

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Lantern-*-win-x64.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" Lantern-*-win-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Lantern ${GITHUB_REF_NAME#v}" --generate-notes
